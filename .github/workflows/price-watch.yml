name: price-watch

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Send a test notification to my phone"
        type: boolean
        default: false

concurrency:
  group: price-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Load saved prices
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Test notification
        if: ${{ inputs.test_notify }}
        run: python price_watch.py --test-notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Check prices
        run: python price_watch.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Save prices
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
